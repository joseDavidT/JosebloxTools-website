<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OptiProjects</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --accent: #3d9990;
            --accent-hover: #4eb3a9;
            --bg-panel: rgba(7, 20, 18, 0.78);
            --bg-card: rgba(14, 32, 29, 0.82);
            --border: rgba(65, 180, 170, 0.28);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: white;

            background:
                linear-gradient(
                    rgba(3, 12, 10, 0.68),
                    rgba(3, 12, 10, 0.82)
                ),
                url("background.avif");

            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }

        /* =========================
           CABECERA
        ========================= */

        header {
            height: 84px;
            display: flex;
            align-items: center;
            padding: 12px 28px;
        }

        .logo {
            width: 230px;
            max-height: 65px;
            object-fit: contain;
            object-position: left center;

            filter:
                drop-shadow(0 0 5px rgba(0, 255, 240, 0.5));

            transition: 0.2s;
        }

        .logo:hover {
            transform: scale(1.03);
        }

        /* =========================
           ESTRUCTURA
        ========================= */

        .layout {
            display: flex;
            gap: 25px;
            padding: 0 25px 35px;
        }

        /* =========================
           MENU
        ========================= */

        .sidebar {
            width: 210px;
            min-width: 210px;

            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;

            padding: 10px;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.35);
        }

        .category {
            width: 100%;

            padding: 13px 10px;
            margin-bottom: 4px;

            border: none;
            border-radius: 6px;

            background: transparent;
            color: white;

            font-size: 15px;
            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.2s;
        }

        .category:hover {
            background: rgba(61, 153, 144, 0.28);
        }

        .category.active {
            background: var(--accent);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
        }

        .category:active {
            transform: scale(0.98);
        }

        /* =========================
           CONTENIDO
        ========================= */

        main {
            flex: 1;
            max-width: 1100px;
        }

        /* BUSCADOR */

        .search {
            width: 100%;

            padding: 14px 18px;

            border-radius: 10px;
            border: 1px solid var(--border);
            outline: none;

            background: rgba(3, 16, 14, 0.82);
            color: white;

            font-size: 15px;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            margin-bottom: 20px;

            transition: border 0.2s;
        }

        .search:focus {
            border-color: rgba(80, 200, 190, 0.7);
        }

        .search::placeholder {
            color: #aaa;
        }

        /* PANEL */

        .panel {
            background: var(--bg-panel);

            border: 1px solid var(--border);
            border-radius: 10px;

            padding: 20px;

            min-height: 300px;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .title {
            font-size: 22px;
            margin-bottom: 20px;
        }

        /* =========================
           TARJETAS
        ========================= */

        .projects {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(220px, 1fr));

            gap: 15px;
        }

        .card {
            background: var(--bg-card);

            border: 1px solid rgba(60, 160, 150, 0.20);

            border-radius: 8px;

            padding: 17px;

            min-height: 175px;

            display: flex;
            flex-direction: column;

            transition:
                transform 0.2s,
                border 0.2s,
                background 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);

            background: rgba(20, 45, 41, 0.9);

            border-color: rgba(70, 190, 180, 0.45);
        }

        .card h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .card p {
            color: #b9c3c1;
            font-size: 14px;
            line-height: 1.4;

            margin-bottom: 15px;
        }

        .tag {
            display: inline-block;

            width: fit-content;

            font-size: 11px;
            font-weight: bold;

            padding: 4px 7px;

            border-radius: 4px;

            background: rgba(65, 150, 142, 0.45);

            margin-bottom: 10px;
        }

        .button {
            display: inline-block;

            width: fit-content;

            margin-top: auto;

            padding: 9px 14px;

            border-radius: 5px;

            background: var(--accent);

            color: white;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;
        }

        .button:hover {
            background: var(--accent-hover);
        }

        /* =========================
           SIN RESULTADOS
        ========================= */

        .no-results {
            color: #aaa;
            text-align: center;

            padding: 50px 10px;

            font-size: 15px;
        }

        /* =========================
           PIE
        ========================= */

        footer {
            text-align: center;

            color: rgba(255, 255, 255, 0.55);

            font-size: 12px;

            padding: 10px 20px 25px;
        }

        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 700px) {

            header {
                justify-content: center;
            }

            .logo {
                width: 200px;
            }

            .layout {
                flex-direction: column;
                padding: 0 15px 25px;
            }

            .sidebar {
                width: 100%;
                min-width: 0;

                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 4px;
            }

            .category {
                margin: 0;
            }

            .projects {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         CABECERA
    ========================= -->

    <header>

        <img
            src="logo.png"
            alt="OptiProjects"
            class="logo"
        >

    </header>


    <!-- =========================
         CONTENIDO
    ========================= -->

    <div class="layout">

        <!-- MENU -->

        <aside class="sidebar">

            <button
                class="category active"
                onclick="changeCategory('Descargas', this)"
            >
                🎮 Descargas de juegos
            </button>

            <button
                class="category"
                onclick="changeCategory('Juegos', this)"
            >
                🌐 Juegos sin descargar
            </button>

            <button
                class="category"
                onclick="changeCategory('Emuladores', this)"
            >
                🕹️ Emuladores
            </button>

            <button
                class="category"
                onclick="changeCategory('Utilidades', this)"
            >
                🛠️ Utilidades
            </button>

        </aside>


        <!-- CONTENIDO PRINCIPAL -->

        <main>

            <input
                id="search"
                class="search"
                type="text"
                placeholder="🔍 Buscar..."
                autocomplete="off"
                oninput="searchProjects()"
            >


            <section class="panel">

                <h2
                    id="title"
                    class="title"
                >
                    🎮 Descargas de juegos
                </h2>


                <div
                    id="projects"
                    class="projects"
                ></div>

            </section>

        </main>

    </div>


    <footer>
        OptiProjects © 2026
    </footer>


    <script>

        /* =========================
           PROYECTOS
        ========================= */

        const projects = {

            Descargas: [

                {
                    name: "Minecraft",
                    description: "Minecraft para PC.",
                    tag: "PC",
                    link: "#"
                },

                {
                    name: "Plants vs Zombies",
                    description: "Versión para PC.",
                    tag: "PC",
                    link: "#"
                }

            ],


            Juegos: [

                {
                    name: "Juego web 1",
                    description:
                        "Juega directamente desde el navegador.",
                    tag: "WEB",
                    link: "#"
                },

                {
                    name: "Juego web 2",
                    description:
                        "Sin instalar nada.",
                    tag: "HTML5",
                    link: "#"
                }

            ],


            Emuladores: [

                {
                    name: "Emulador Retro",
                    description:
                        "Emulador para juegos clásicos.",
                    tag: "RETRO",
                    link: "#"
                },

                {
                    name: "Emulador Android",
                    description:
                        "Emulador para aplicaciones Android.",
                    tag: "ANDROID",
                    link: "#"
                }

            ],


            Utilidades: [

                {
                    name: "Herramienta Windows",
                    description:
                        "Utilidad para Windows.",
                    tag: "WINDOWS",
                    link: "#"
                },

                {
                    name: "Herramienta de sistema",
                    description:
                        "Herramienta para mantenimiento.",
                    tag: "UTILIDAD",
                    link: "#"
                }

            ]

        };


        /* =========================
           VARIABLES
        ========================= */

        let currentCategory = "Descargas";


        /* =========================
           TÍTULOS
        ========================= */

        const titles = {

            Descargas: "🎮 Descargas de juegos",

            Juegos: "🌐 Juegos sin descargar",

            Emuladores: "🕹️ Emuladores",

            Utilidades: "🛠️ Utilidades"

        };


        /* =========================
           MOSTRAR PROYECTOS
        ========================= */

        function renderProjects(list) {

            const container =
                document.getElementById("projects");

            container.innerHTML = "";


            if (list.length === 0) {

                container.innerHTML = `
                    <div class="no-results">
                        🔎 No se encontraron proyectos.
                    </div>
                `;

                return;
            }


            list.forEach(project => {

                const card =
                    document.createElement("div");

                card.className = "card";


                card.innerHTML = `

                    <span class="tag">
                        ${project.tag}
                    </span>

                    <h3>
                        ${project.name}
                    </h3>

                    <p>
                        ${project.description}
                    </p>

                    <a
                        class="button"
                        href="${project.link}"
                    >
                        Ver proyecto
                    </a>

                `;


                container.appendChild(card);

            });

        }


        /* =========================
           CAMBIAR CATEGORÍA
        ========================= */

        function changeCategory(category, button) {

            currentCategory = category;


            document.getElementById("title")
                .textContent = titles[category];


            document
                .querySelectorAll(".category")
                .forEach(btn => {

                    btn.classList.remove("active");

                });


            button.classList.add("active");


            document.getElementById("search").value = "";


            renderProjects(projects[category]);

        }


        /* =========================
           BUSCADOR
        ========================= */

        function searchProjects() {

            const query =
                document
                    .getElementById("search")
                    .value
                    .toLowerCase()
                    .trim();


            const filtered =
                projects[currentCategory].filter(project =>

                    project.name
                        .toLowerCase()
                        .includes(query)

                    ||

                    project.description
                        .toLowerCase()
                        .includes(query)

                    ||

                    project.tag
                        .toLowerCase()
                        .includes(query)

                );


            renderProjects(filtered);

        }


        /* =========================
           INICIO
        ========================= */

        renderProjects(projects.Descargas);

    </script>

</body>
</html>

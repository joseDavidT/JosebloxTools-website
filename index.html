<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JosebloxTools</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* =========================
               PALETA ROJA
            ========================= */

            --accent: #c62828;
            --accent-hover: #e53935;

            --panel: rgba(25, 5, 5, 0.82);
            --panel-dark: rgba(18, 3, 3, 0.88);

            --border: rgba(220, 60, 60, 0.30);

            --text: #ffffff;
            --muted: #c5aaaa;
        }


        /* ==============================
           FONDO
        ============================== */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: var(--text);

            background:

                linear-gradient(
                    rgba(18, 3, 3, 0.68),
                    rgba(18, 3, 3, 0.82)
                ),

                url("background.avif");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

        }


        /* ==============================
           HEADER
        ============================== */

        header {

            height: 84px;

            display: flex;

            align-items: center;

            padding:
                10px
                25px;

        }


        .logo {

            width: 230px;

            max-height: 65px;

            object-fit: contain;

            object-position: left center;

            filter:
                drop-shadow(
                    0 0 5px
                    rgba(255, 40, 40, 0.45)
                );

        }


        /* ==============================
           ESTRUCTURA PRINCIPAL
        ============================== */

        .layout {

            display: flex;

            gap: 25px;

            padding:
                0 25px 30px;

        }


        /* ==============================
           MENU PRINCIPAL
        ============================== */

        .sidebar {

            width: 210px;

            min-width: 210px;

            height: fit-content;

            padding: 10px;

            background:
                var(--panel);

            border:
                1px solid var(--border);

            border-radius: 10px;

            backdrop-filter:
                blur(12px);

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.35);

        }


        .category {

            width: 100%;

            border: none;

            background: transparent;

            color: white;

            padding: 13px 10px;

            margin-bottom: 4px;

            border-radius: 6px;

            font-size: 15px;

            cursor: pointer;

            transition: 0.2s;

        }


        .category:hover {

            background:
                rgba(190, 40, 40, 0.28);

        }


        .category.active {

            background:
                var(--accent);

        }


        /* ==============================
           CONTENIDO
        ============================== */

        main {

            flex: 1;

            max-width: 1100px;

            min-width: 0;

        }


        /* ==============================
           BUSCADOR
        ============================== */

        .search {

            width: 100%;

            padding:
                14px 18px;

            margin-bottom: 20px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            outline: none;

            background:
                rgba(20, 3, 3, 0.82);

            color: white;

            font-size: 15px;

            backdrop-filter:
                blur(12px);

        }


        .search::placeholder {

            color: #aaa;

        }


        .search:focus {

            border-color:
                rgba(240, 70, 70, 0.7);

        }


        /* ==============================
           PANEL
        ============================== */

        .panel {

            background:
                var(--panel);

            border:
                1px solid var(--border);

            border-radius: 10px;

            padding: 20px;

            backdrop-filter:
                blur(12px);

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.3);

        }


        .title {

            font-size: 22px;

            margin-bottom: 18px;

        }


        /* ==============================
           LISTA DE PROYECTOS
        ============================== */

        .project-list {

            display: flex;

            flex-direction: column;

            gap: 6px;

        }


        .project-row {

            width: 100%;

            min-height: 42px;

            display: flex;

            align-items: center;

            gap: 10px;

            padding:
                8px 10px;

            border-radius: 5px;

            background:
                rgba(35, 8, 8, 0.75);

            border:
                1px solid
                rgba(180, 45, 45, 0.16);

            cursor: pointer;

            transition:
                background 0.18s,
                border 0.18s,
                transform 0.18s;

        }


        .project-row:hover {

            background:
                rgba(90, 25, 25, 0.9);

            border-color:
                rgba(240, 70, 70, 0.40);

            transform:
                translateX(3px);

        }


        .project-name {

            font-weight: bold;

            font-size: 14px;

        }


        .tag {

            display: inline-block;

            padding:
                3px 6px;

            border-radius: 3px;

            background:
                rgba(190, 45, 45, 0.50);

            color: white;

            font-size: 10px;

            font-weight: bold;

        }


        /* ==============================
           DETALLES
        ============================== */

        .details {

            max-width: 850px;

            margin: auto;

        }


        .back-button {

            display: inline-block;

            margin-bottom: 18px;

            padding:
                9px 14px;

            border: none;

            border-radius: 5px;

            background:
                rgba(70, 18, 18, 0.9);

            color: white;

            cursor: pointer;

            font-size: 14px;

        }


        .back-button:hover {

            background:
                var(--accent);

        }


        .details-title {

            font-size: 27px;

            margin-bottom: 8px;

        }


        .details-tags {

            display: flex;

            gap: 7px;

            flex-wrap: wrap;

            margin-bottom: 20px;

        }


        .details-description {

            color: var(--muted);

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 25px;

        }


        .info-box {

            padding: 17px;

            margin-bottom: 20px;

            background:
                rgba(25, 5, 5, 0.72);

            border:
                1px solid
                rgba(190, 45, 45, 0.20);

            border-radius: 7px;

        }


        .info-box h3 {

            margin-bottom: 10px;

            font-size: 17px;

        }


        .info-box p {

            color: var(--muted);

            line-height: 1.5;

            font-size: 14px;

        }


        .download-button {

            display: inline-block;

            padding:
                12px 20px;

            background:
                var(--accent);

            color: white;

            text-decoration: none;

            border-radius: 6px;

            font-weight: bold;

            transition: 0.2s;

        }


        .download-button:hover {

            background:
                var(--accent-hover);

            transform:
                translateY(-2px);

        }


        /* ==============================
           SIN RESULTADOS
        ============================== */

        .no-results {

            text-align: center;

            color: #aaa;

            padding: 50px 10px;

        }


        /* ==============================
           FOOTER
        ============================== */

        footer {

            text-align: center;

            color:
                rgba(255,255,255,0.5);

            font-size: 12px;

            padding:
                10px 20px 25px;

        }


        /* ==============================
           MOVIL
        ============================== */

        @media (max-width: 700px) {

            .layout {

                flex-direction: column;

                padding:
                    0 15px 25px;

            }


            .sidebar {

                width: 100%;

                min-width: 0;

                display: grid;

                grid-template-columns:
                    1fr 1fr;

                gap: 4px;

            }


            .category {

                margin: 0;

            }


            .details-title {

                font-size: 22px;

            }

        }

    </style>
</head>


<body>


    <!-- ==================================
         LOGO
    =================================== -->

    <header>

        <img
            src="logo.png"
            alt="JosebloxTools"
            class="logo"
        >

    </header>


    <!-- ==================================
         ESTRUCTURA
    =================================== -->

    <div class="layout">


        <!-- ===============================
             MENU
        ================================ -->

        <aside class="sidebar">

            <button
                class="category active"
                onclick="changeCategory('Descargas', this)"
            >
                🎮 Descargas de juegos
            </button>


            <button
                class="category"
                onclick="changeCategory('Juegos', this)"
            >
                🌐 Juegos sin descargar
            </button>


            <button
                class="category"
                onclick="changeCategory('Emuladores', this)"
            >
                🕹️ Emuladores
            </button>


            <button
                class="category"
                onclick="changeCategory('Utilidades', this)"
            >
                🛠️ Utilidades
            </button>

        </aside>


        <!-- ===============================
             CONTENIDO
        ================================ -->

        <main>


            <!-- BUSCADOR -->

            <input
                id="search"
                class="search"
                type="text"
                placeholder="🔍 Buscar..."
                autocomplete="off"
                oninput="searchProjects()"
            >


            <!-- PANEL -->

            <section class="panel">

                <div id="content"></div>

            </section>


        </main>

    </div>


    <footer>

        JosebloxTools © 2026

    </footer>



    <script>


        /* =================================
           DATOS DE LOS PROYECTOS
        ================================= */

        const projects = {


            Descargas: [

                {
                    name: "Minecraft",
                    tags: ["PC"],
                    description:
                        "Minecraft para PC.",
                    version:
                        "Versión 1.0",
                    requirements:
                        "Windows 10/11",
                    download:
                        "#"
                },


                {
                    name: "Plants vs Zombies",
                    tags: ["PC"],
                    description:
                        "Plants vs Zombies para PC.",
                    version:
                        "Versión 1.0",
                    requirements:
                        "Windows XP,1gb de RAM,17mb de almacenamiento,Directx 8",
                    download:
                        "https://www.mediafire.com/file/glko5mx5ht56qjd/Plantas+VS+Zombies+GOTY.7z/file"
                },


                {
                    name: "Juego de prueba",
                    tags: ["PC", "PORT"],
                    description:
                        "Proyecto de prueba para la web.",
                    version:
                        "1.0",
                    requirements:
                        "Windows",
                    download:
                        "#"
                }

            ],



            Juegos: [

                {
                    name: "Juego web 1",
                    tags: ["WEB"],
                    description:
                        "Juega directamente desde el navegador.",
                    version:
                        "1.0",
                    requirements:
                        "Navegador moderno",
                    download:
                        "#"
                },


                {
                    name: "Juego web 2",
                    tags: ["HTML5"],
                    description:
                        "No necesitas instalar nada.",
                    version:
                        "1.0",
                    requirements:
                        "Chrome, Edge o Firefox",
                    download:
                        "#"
                }

            ],



            Emuladores: [

                {
                    name: "Emulador Retro",
                    tags: ["RETRO"],
                    description:
                        "Emulador para juegos clásicos.",
                    version:
                        "1.0",
                    requirements:
                        "Windows",
                    download:
                        "#"
                },


                {
                    name: "Emulador Android",
                    tags: ["ANDROID"],
                    description:
                        "Emulador para aplicaciones Android.",
                    version:
                        "1.0",
                    requirements:
                        "Windows 10/11",
                    download:
                        "#"
                }

            ],



            Utilidades: [

                {
                    name: "Herramienta Windows",
                    tags: ["WINDOWS"],
                    description:
                        "Utilidad para Windows.",
                    version:
                        "1.0",
                    requirements:
                        "Windows",
                    download:
                        "#"
                },


                {
                    name: "Herramienta de sistema",
                    tags: ["UTILIDAD"],
                    description:
                        "Herramienta para mantenimiento.",
                    version:
                        "1.0",
                    requirements:
                        "Windows",
                    download:
                        "#"
                }

            ]

        };



        /* =================================
           TITULOS
        ================================= */

        const titles = {

            Descargas:
                "🎮 Descargas de juegos",

            Juegos:
                "🌐 Juegos sin descargar",

            Emuladores:
                "🕹️ Emuladores",

            Utilidades:
                "🛠️ Utilidades"

        };



        /* =================================
           CATEGORIA ACTUAL
        ================================= */

        let currentCategory =
            "Descargas";



        /* =================================
           MOSTRAR LISTA
        ================================= */

        function renderProjects(list) {


            const content =
                document.getElementById("content");


            content.innerHTML = `

                <h2 class="title">
                    ${titles[currentCategory]}
                </h2>

                <div
                    class="project-list"
                    id="projectList"
                ></div>

            `;


            const projectList =
                document.getElementById(
                    "projectList"
                );


            if (list.length === 0) {

                projectList.innerHTML = `

                    <div class="no-results">

                        🔎 No se encontraron proyectos.

                    </div>

                `;

                return;

            }


            list.forEach((project, index) => {


                const row =
                    document.createElement("div");


                row.className =
                    "project-row";


                row.onclick = () => {

                    showDetails(project);

                };


                let tags = "";


                project.tags.forEach(tag => {

                    tags += `
                        <span class="tag">
                            ${tag}
                        </span>
                    `;

                });


                row.innerHTML = `

                    <span class="project-name">
                        ${project.name}
                    </span>

                    ${tags}

                `;


                projectList.appendChild(row);

            });

        }



        /* =================================
           MOSTRAR DETALLES
        ================================= */

        function showDetails(project) {


            const content =
                document.getElementById("content");


            let tags = "";


            project.tags.forEach(tag => {

                tags += `
                    <span class="tag">
                        ${tag}
                    </span>
                `;

            });


            content.innerHTML = `

                <div class="details">


                    <button
                        class="back-button"
                        onclick="goBack()"
                    >
                        ← Volver
                    </button>


                    <h1 class="details-title">

                        ${project.name}

                    </h1>


                    <div class="details-tags">

                        ${tags}

                    </div>


                    <p class="details-description">

                        ${project.description}

                    </p>


                    <div class="info-box">

                        <h3>
                            📦 Información
                        </h3>

                        <p>
                            Versión:
                            ${project.version}
                        </p>

                    </div>


                    <div class="info-box">

                        <h3>
                            💻 Requisitos
                        </h3>

                        <p>
                            ${project.requirements}
                        </p>

                    </div>


                    <a
                        class="download-button"
                        href="${project.download}"
                    >
                        ⬇️ Descargar
                    </a>


                </div>

            `;

        }



        /* =================================
           VOLVER A LA LISTA
        ================================= */

        function goBack() {

            const query =
                document
                    .getElementById("search")
                    .value
                    .toLowerCase()
                    .trim();


            if (query) {

                searchProjects();

            } else {

                renderProjects(
                    projects[currentCategory]
                );

            }

        }



        /* =================================
           CAMBIAR CATEGORIA
        ================================= */

        function changeCategory(
            category,
            button
        ) {


            currentCategory =
                category;


            document
                .querySelectorAll(".category")
                .forEach(btn => {

                    btn.classList.remove(
                        "active"
                    );

                });


            button.classList.add(
                "active"
            );


            document
                .getElementById("search")
                .value = "";


            renderProjects(
                projects[category]
            );

        }



        /* =================================
           BUSCADOR
        ================================= */

        function searchProjects() {


            const query =
                document
                    .getElementById("search")
                    .value
                    .toLowerCase()
                    .trim();


            const filtered =
                projects[currentCategory]
                .filter(project => {


                    const name =
                        project.name
                            .toLowerCase();


                    const tags =
                        project.tags
                            .join(" ")
                            .toLowerCase();


                    return (

                        name.includes(query)

                        ||

                        tags.includes(query)

                    );

                });


            renderProjects(
                filtered
            );

        }



        /* =================================
           INICIO
        ================================= */

        renderProjects(
            projects.Descargas
        );


    </script>

</body>
</html>
